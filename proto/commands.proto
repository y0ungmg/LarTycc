syntax = "proto3";

package lartycc.v1;

message CommandEnvelope {
  string command_id = 1;
  uint64 expected_project_revision = 2;
  oneof command {
    SetTempo set_tempo = 10;
    CreateTrack create_track = 11;
  }
}

message SetTempo { double bpm = 1; }
message CreateTrack { string track_id = 1; string name = 2; }

message AudioDeviceInfo {
  string id = 1;
  string name = 2;
  bool is_default = 3;
}

message TransportSnapshot {
  bool playing = 1;
  uint64 position_frames = 2;
  uint32 sample_rate = 3;
  uint64 callback_count = 4;
}

message StartTransport {
  string device_id = 1;
  uint32 sample_rate = 2;
  uint32 period_frames = 3;
}
