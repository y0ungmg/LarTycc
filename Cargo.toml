[workspace]
members = ["core", "ai-runtime", "audio-bridge", "apps/desktop"]
exclude = ["apps/desktop-webview"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
